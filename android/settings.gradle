// SwarmGlu — settings.gradle
// Tous les plugins viennent de google()/mavenCentral() : Chaquopy 17 est
// publié sur Maven Central (la machine de BUILD doit avoir Internet une
// seule fois ; le nœud Android ainsi produit fonctionne ensuite hors-ligne).

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "SwarmGlu"
include ':app'
