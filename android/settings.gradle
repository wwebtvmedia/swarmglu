// SwarmGlu — settings.gradle
// Dépôt des plugins : Chaquopy est distribué via son propre Maven
// (la machine de BUILD doit avoir Internet une seule fois ; le nœud
// Android ainsi produit fonctionne ensuite 100 % hors-ligne).

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://chaquo.com/maven" }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "SwarmGlu"
include ':app'
