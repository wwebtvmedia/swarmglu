// SwarmGlu — settings.gradle
// Plugins depuis google()/mavenCentral() uniquement. La machine de BUILD
// doit avoir Internet une seule fois ; l'exécution reste 100 % hors-ligne.

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "SwarmGlu"
include ':app'
