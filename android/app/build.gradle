// SwarmGlu — app/build.gradle
// Application Android com.tree4five.swarmglu.
//
// Intégrateur Chaquopy : embarque l'interpréteur CPython et exécute les
// modules SwarmGlu NON MODIFIÉS (aucun pip requis : bibliothèque standard
// uniquement). Le protocole est ainsi strictement identique entre les PC
// et les tablettes de l'école — impossible qu'il diverge.

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

// ---------------------------------------------------------------------------
// Signature de release : lue depuis keystore.properties (NON versionné —
// voir google-play/PLAY_CHECKLIST.md §Signature). Si le fichier est absent,
// la clé debug est utilisée : assembleDebug et assembleRelease restent
// fonctionnels, seul l'AAB non signé importable nulle part.
// ---------------------------------------------------------------------------
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.tree4five.swarmglu'
    // targetSdk 36 : exigence Google Play pour toute NOUVELLE app soumise
    // Chaquopy 17 couvre l_alignement mémoire 16 Ko (exigence 31/10/2025).
    compileSdk 36

    defaultConfig {
        applicationId "com.tree4five.swarmglu"
        minSdk 24          // Android 7.0 : couvre la quasi-totalité des tablettes scolales
        targetSdk 36
        versionCode 3      // incrémenter à CHAQUE upload Play (entier strictement croissant)
        versionName "1.1.1"

        ndk {
            // ABI supportées : tablettes ARM (32/64 bits) + émulateurs x86.
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        // Tests instrumentés (émulateur/tablette) :
        //   ./gradlew connectedDebugAndroidTest
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Configurée uniquement si keystore.properties existe (sinon
            // bloc vide, jamais référencé par buildTypes).
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            // R8 : réduction + obfuscation — règles Chaquopy conservées
            // (voir proguard-rules.pro). L'AAB en sort plus léger.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Interpréteur Python embarqué (aucun paquet pip : stdlib pure).
// DSL Chaquopy 16+ : bloc `chaquopy { defaultConfig { ... } }` (l'ancien
// bloc `python {}` des versions 14/15 n'existe plus).
chaquopy {
    defaultConfig {
        version = "3.11"
        buildPython = ["python3"]  // interpréteur hôte utilisé à la construction
    }
}

// Les modules du nœud vivent à la RACINE du dépôt SwarmGlu (source de
// vérité unique, partagée PC/Android) : cette tâche les re-copie dans le
// source set Python avant chaque build. `android/` peut aussi être build
// seul : src/main/python contient déjà une copie fonctionnelle.
task syncSwarmGluCore(type: Copy) {
    description = "Synchronise les modules SwarmGlu depuis la racine du dépôt."
    from rootProject.projectDir.parentFile
    include 'security.py', 'consensus.py', 'state_manager.py',
            'gateway.py', 'swarm_glu.py', 'android_bridge.py',
            'crypto_auth.py', 'decentralized_resigner.py'
    into 'src/main/python'
}
preBuild.dependsOn syncSwarmGluCore
// Dépendance explicite requise par Gradle : les tâches de fusion Python
// de Chaquopy lisent le répertoire que syncSwarmGluCore vient d'écrire.
tasks.configureEach { t ->
    if (t.name ==~ /merge\w*PythonSources/) {
        t.dependsOn syncSwarmGluCore
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'

    // Tests instrumentés : la boucle SwarmGlu complète dans l'émulateur.
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
