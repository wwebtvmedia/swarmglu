// SwarmGlu — app/build.gradle
// Application Android com.tree4five.swarmglu.
//
// Intégrateur Chaquopy : embarque l'interpréteur CPython et exécute les
// modules SwarmGlu NON MODIFIÉS (aucun pip requis : bibliothèque standard
// uniquement). Le protocole est ainsi strictement identique entre les PC
// et les tablettes de l'école — impossible qu'il diverge.

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---------------------------------------------------------------------------
// Signature de release : keystore.properties (NON versionné — voir
// google-play/PLAY_CHECKLIST.md). Absent -> clé debug.
// ---------------------------------------------------------------------------
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.tree4five.swarmglu'
    // targetSdk 36 : exigence Google Play pour toute NOUVELLE app soumise
    // Chaquopy 17 couvre l_alignement mémoire 16 Ko (exigence 31/10/2025).
    compileSdk 36

    defaultConfig {
        applicationId "com.tree4five.swarmglu"
        minSdk 24          // Android 7.0 : couvre la quasi-totalité des tablettes scolales
        targetSdk 36
        versionCode 6      // incrémenter à CHAQUE upload Play (entier strictement croissant)
        versionName "2.0.0"

        ndk {
            // ABI supportées : tablettes ARM (32/64 bits) + émulateurs x86.
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        // Tests instrumentés (émulateur/tablette) :
        //   ./gradlew connectedDebugAndroidTest
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Configurée uniquement si keystore.properties existe (sinon
            // bloc vide, jamais référencé par buildTypes).
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            // R8 : réduction + obfuscation — règles Chaquopy conservées
            // (voir proguard-rules.pro). L'AAB en sort plus léger.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}


// Dépendance explicite requise par Gradle : les tâches de fusion Python
// de Chaquopy lisent le répertoire que syncSwarmGluCore vient d'écrire.

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'

    // Phase 2 (noyau Kotlin natif) :
    //  * NanoHTTPD : serveur HTTP du nœud (Android n'a pas com.sun.net).
    //  * BouncyCastle : ML-KEM-768 post-quantique réel (API légère, sans
    //    insertion de Provider — interdit au runtime Android).
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.79'

    // Tests instrumentés : la boucle SwarmGlu complète dans l'émulateur.
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
